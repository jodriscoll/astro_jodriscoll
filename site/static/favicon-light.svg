<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Light-theme twin of favicon.svg (cream ground, the light accent red).
       A J drawn on a 7x7 grid. Without animation (or as a still) every J cell is lit;
       browsers that animate SVG icons wipe it off and redraw it in stroke order. -->
  <style>
    .off { fill: #d6363b; opacity: .16 }
    .on { fill: #d6363b; animation: draw 4.2s cubic-bezier(.3,0,.2,1) infinite }
    @keyframes draw { 0% { opacity: .16 } 5% { opacity: 1 } 82% { opacity: 1 } 88%, 100% { opacity: .16 } }
    @media (prefers-reduced-motion: reduce) { .on { animation: none } }
  </style>
